  - id: mangadex
    name: "MangaDex"
    domains:
      - "https://mangadex.org"
      - "https://api.mangadex.org"
    parser_class: "nexusdl.parsers.en.mangadex:MangaDexParser"
    language: "multi"
    content_rating: "safe"
    adult: false
    capabilities:
      supports_search: true
      supports_manga_info: true
      supports_chapters: true
      supports_pages: true
      supports_download: true
      supports_language_filter: true
      supports_content_rating_filter: true
      requires_auth: false
      requires_cloudflare_bypass: false
      requires_javascript_rendering: false
      max_concurrent_downloads: 8
      rate_limit_per_second: 4.0
      min_delay_between_requests: 0.25
    default_headers:
      Referer: "https://mangadex.org/"
      Origin: "https://mangadex.org"
    cookies_required: []
    region_locked: false
    scanlation_group: null
    notes: "API officielle v5. Supporte le filtrage par langue et content rating."
    enabled: true

