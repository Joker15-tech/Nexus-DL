# ============================================================================
# NEXUSDL — Configuration des sites supportés
# ============================================================================
#
# Ce fichier définit la configuration de tous les sites de manga/webtoon/comics
# supportés par NexusDL. Il est validé contre le schéma JSON Schema défini
# dans sites_schema.json (draft 2020-12).
#
# Structure :
#   - version      : Version du schéma (SemVer)
#   - last_updated : Date de dernière mise à jour (ISO 8601)
#   - sites        : Liste des configurations de sites
#
# Chaque site doit avoir :
#   - id           : Identifiant unique (snake_case)
#   - name         : Nom d'affichage
#   - domains      : Liste des domaines (primaire en premier)
#   - parser_class : Référence de la classe de parser (module:Class)
#   - language     : Langue principale (ISO 639-1)
#   - capabilities : Capacités opérationnelles
#
# Pour ajouter un nouveau site :
#   1. Ajouter une entrée dans la section de langue appropriée
#   2. Implémenter le parser dans nexusdl/parsers/<lang>/<site_id>.py
#   3. Valider avec : python scripts/validate_sites.py
#   4. Tester avec : nexusdl search --site <site_id> "query"
#
# ============================================================================

version: "1.0.0"
last_updated: "2026-09-23"

sites:

