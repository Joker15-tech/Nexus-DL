<?xml version="1.0" encoding="UTF-8"?>
<!--
  NexusDL Favicon — Style Cyberpunk Neon / Hacker
  Couleurs : vert néon (#00ff41), cyan (#00ffff), noir (#000000)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient néon vertical -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc33;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond noir -->
  <rect width="64" height="64" fill="#000000" rx="8"/>

  <!-- Bordure néon -->
  <rect x="2" y="2" width="60" height="60" fill="none"
        stroke="#00ff41" stroke-width="1.5" rx="6" opacity="0.6"/>

  <!-- Symbole "N" stylisé (Nexus) -->
  <g filter="url(#glow)">
    <!-- Barre gauche du N -->
    <path d="M 18 18 L 18 46" stroke="url(#neonGradient)" stroke-width="4"
          stroke-linecap="round" fill="none"/>
    <!-- Diagonale du N -->
    <path d="M 18 18 L 46 46" stroke="url(#neonGradient)" stroke-width="4"
          stroke-linecap="round" fill="none"/>
    <!-- Barre droite du N -->
    <path d="M 46 18 L 46 46" stroke="url(#neonGradient)" stroke-width="4"
          stroke-linecap="round" fill="none"/>
  </g>

  <!-- Point de téléchargement (flèche vers le bas) -->
  <g filter="url(#glow)" opacity="0.9">
    <path d="M 32 36 L 32 48 M 28 44 L 32 48 L 36 44"
          stroke="#00ffff" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Petits accents décoratifs -->
  <circle cx="12" cy="12" r="1" fill="#00ffff" opacity="0.8"/>
  <circle cx="52" cy="12" r="1" fill="#ff00ff" opacity="0.8"/>
  <circle cx="12" cy="52" r="1" fill="#ff00ff" opacity="0.8"/>
  <circle cx="52" cy="52" r="1" fill="#00ffff" opacity="0.8"/>
</svg>
