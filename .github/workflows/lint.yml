# ============================================================================
# NEXUSDL - Lint Workflow
# ============================================================================
#
# Ce workflow effectue une analyse statique complète du code NexusDL :
#   1. Python    : Ruff (linter + formatter) + mypy (type checking)
#   2. Frontend  : ESLint + Prettier + TypeScript
#   3. YAML      : yamllint pour les configurations
#   4. Markdown  : markdownlint pour la documentation
#   5. Actions   : actionlint pour les workflows GitHub
#   6. JSON      : jsonlint pour les fichiers de config
#
# Déclencheurs :
#   - Push sur toutes les branches
#   - Pull Requests
#   - Déclenchement manuel (workflow_dispatch)
#
# Caractéristiques :
#   - Jobs parallèles pour une exécution rapide
#   - Cache pip et pnpm
#   - Upload des résultats en SARIF vers GitHub Security
#   - Annotations GitHub pour les erreurs de lint
#   - Rapports détaillés dans le Job Summary
#
# ============================================================================

name: Lint

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      fix_mode:
        description: "Auto-fix issues where possible"
        required: false
        default: "false"
        type: boolean

# ============================================================================
# PERMISSIONS
# ============================================================================
permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

# ============================================================================
# CONCURRENCY
# ============================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
# VARIABLES GLOBALES
# ============================================================================
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  FRONTEND_DIR: "src/nexusdl/interfaces/web/frontend"
  FIX_MODE: ${{ github.event.inputs.fix_mode || 'false' }}

# ============================================================================
# JOBS
# ============================================================================
jobs:
  # ==========================================================================
  # JOB 1 : PYTHON LINT (Ruff + mypy)
  # ==========================================================================
  python-lint:
    name: "Python Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-PyYAML types-requests

      # ------------------------------------------------------------------
      # Ruff : Linter ultra-rapide (remplace flake8, isort, pyupgrade)
      # ------------------------------------------------------------------
      - name: Run Ruff linter
        id: ruff-lint
        run: |
          ruff check src/ tests/ \
            --output-format=github \
            --output-format=concise \
            ${{ env.FIX_MODE == 'true' && '--fix' || '' }}

      - name: Run Ruff formatter check
        if: env.FIX_MODE != 'true'
        run: |
          ruff format --check src/ tests/

      # ------------------------------------------------------------------
      # mypy : Type checking statique
      # ------------------------------------------------------------------
      - name: Install project for mypy
        run: |
          pip install -e ".[dev]" || pip install -r requirements.txt

      - name: Run mypy type checking
        id: mypy
        run: |
          mypy src/nexusdl \
            --ignore-missing-imports \
            --no-strict-optional \
            --show-error-codes \
            --show-column-numbers \
            --show-error-context \
            --junit-xml mypy-results.xml \
            || true

      # ------------------------------------------------------------------
      # Upload des résultats
      # ------------------------------------------------------------------
      - name: Upload mypy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-results
          path: mypy-results.xml
          retention-days: 7

      - name: Generate Python lint summary
        if: always()
        run: |
          echo "## 🐍 Python Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff (linter) | ${{ steps.ruff-lint.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff (formatter) | ${{ env.FIX_MODE == 'true' && '⏭️ Skipped (fix mode)' || '✅ Checked' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| mypy (types) | ${{ steps.mypy.outcome == 'success' && '✅ Passed' || '⚠️ Warnings' }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB 2 : FRONTEND LINT (ESLint + Prettier + TypeScript)
  # ==========================================================================
  frontend-lint:
    name: "Frontend Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "${{ env.FRONTEND_DIR }}/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------
      # ESLint : Linter JavaScript/TypeScript/React
      # ------------------------------------------------------------------
      - name: Run ESLint
        id: eslint
        run: |
          pnpm lint \
            --format=stylish \
            ${{ env.FIX_MODE == 'true' && '--fix' || '' }}

      - name: Upload ESLint results (SARIF)
        if: always()
        run: |
          pnpm lint --format=@microsoft/eslint-formatter-sarif --output-file eslint-results.sarif || true

      - name: Upload ESLint SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.FRONTEND_DIR }}/eslint-results.sarif
          category: eslint
        continue-on-error: true

      # ------------------------------------------------------------------
      # Prettier : Vérification du formatage
      # ------------------------------------------------------------------
      - name: Run Prettier check
        if: env.FIX_MODE != 'true'
        id: prettier
        run: |
          pnpm format:check

      - name: Run Prettier fix
        if: env.FIX_MODE == 'true'
        run: |
          pnpm format

      # ------------------------------------------------------------------
      # TypeScript : Type checking strict
      # ------------------------------------------------------------------
      - name: Run TypeScript type check
        id: tsc
        run: |
          pnpm type-check

      # ------------------------------------------------------------------
      # Résumé
      # ------------------------------------------------------------------
      - name: Generate frontend lint summary
        if: always()
        run: |
          echo "## 🎨 Frontend Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint | ${{ steps.eslint.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prettier | ${{ env.FIX_MODE == 'true' && '🔧 Auto-fixed' || (steps.prettier.outcome == 'success' && '✅ Passed' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ steps.tsc.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB 3 : YAML LINT
  # ==========================================================================
  yaml-lint:
    name: "YAML Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        id: yamllint
        run: |
          yamllint \
            -d "{extends: default, rules: {line-length: {max: 200}, truthy: disable, comments-indentation: disable}}" \
            -f github \
            .github/ \
            docker/ \
            config/ \
            *.yml \
            *.yaml \
            2>&1 | tee yamllint-output.txt || true

      - name: Generate YAML lint summary
        if: always()
        run: |
          echo "## 📄 YAML Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s yamllint-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat yamllint-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All YAML files are valid" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # JOB 4 : MARKDOWN LINT
  # ==========================================================================
  markdown-lint:
    name: "Markdown Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        id: markdownlint
        run: |
          markdownlint \
            '**/*.md' \
            --ignore node_modules \
            --ignore .next \
            --ignore dist \
            --ignore LICENSE \
            --ignore CHANGELOG.md \
            --config .markdownlint.json \
            || true

      - name: Generate Markdown lint summary
        if: always()
        run: |
          echo "## 📝 Markdown Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Markdown files checked" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB 5 : GITHUB ACTIONS LINT
  # ==========================================================================
  actionlint:
    name: "GitHub Actions Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: warning
          fail_on_error: true

      - name: Generate Actions lint summary
        if: always()
        run: |
          echo "## ⚙️ GitHub Actions Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All workflow files are valid" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB 6 : JSON LINT
  # ==========================================================================
  json-lint:
    name: "JSON Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install jsonlint
        run: npm install -g jsonlint

      - name: Run jsonlint
        id: jsonlint
        run: |
          find . \
            -name "*.json" \
            -not -path "*/node_modules/*" \
            -not -path "*/.next/*" \
            -not -path "*/dist/*" \
            -not -path "*/.git/*" \
            -not -name "pnpm-lock.yaml" \
            -exec jsonlint -q {} \; \
            2>&1 | tee jsonlint-output.txt || true

      - name: Generate JSON lint summary
        if: always()
        run: |
          echo "## 📋 JSON Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s jsonlint-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat jsonlint-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All JSON files are valid" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # JOB 7 : SPELL CHECK (Documentation)
  # ==========================================================================
  spell-check:
    name: "Spell Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check spelling in docs
        uses: reviewdog/action-misspell@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          locale: "US"
          level: warning
          exclude: |
            *.lock
            *.svg
            *.png
            *.jpg
            pnpm-lock.yaml
            requirements*.txt
          reporter: github-pr-review

  # ==========================================================================
  # JOB 8 : LINK CHECK (Documentation)
  # ==========================================================================
  link-check:
    name: "Link Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link Checker
        id: link-checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302
            --exclude-path node_modules
            --exclude-path .next
            --exclude-path dist
            --exclude-mail
            './**/*.md'
            './**/*.html'
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # JOB 9 : RÉSUMÉ GLOBAL
  # ==========================================================================
  lint-summary:
    name: "Lint Summary"
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - frontend-lint
      - yaml-lint
      - markdown-lint
      - actionlint
      - json-lint
    if: always()
    timeout-minutes: 2

    steps:
      - name: Generate global summary
        run: |
          echo "# 🔍 Lint Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Fix mode:** \`${{ env.FIX_MODE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📊 Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 Python | ${{ needs.python-lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Frontend | ${{ needs.frontend-lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📄 YAML | ${{ needs.yaml-lint.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 Markdown | ${{ needs.markdown-lint.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚙️ GitHub Actions | ${{ needs.actionlint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 JSON | ${{ needs.json-lint.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Afficher les détails des jobs en échec
          if [[ "${{ needs.python-lint.result }}" != "success" ]] || [[ "${{ needs.frontend-lint.result }}" != "success" ]]; then
            echo "## ⚠️ Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the failed jobs above and fix the linting issues." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Quick fixes" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "# Auto-fix Python issues" >> $GITHUB_STEP_SUMMARY
            echo "ruff check --fix src/" >> $GITHUB_STEP_SUMMARY
            echo "ruff format src/" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Auto-fix frontend issues" >> $GITHUB_STEP_SUMMARY
            echo "cd ${{ env.FRONTEND_DIR }}" >> $GITHUB_STEP_SUMMARY
            echo "pnpm lint --fix" >> $GITHUB_STEP_SUMMARY
            echo "pnpm format" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if critical linters failed
        if: needs.python-lint.result == 'failure' || needs.frontend-lint.result == 'failure' || needs.actionlint.result == 'failure'
        run: |
          echo "❌ Critical linting jobs failed!"
          echo "Please fix the issues before merging."
          exit 1
