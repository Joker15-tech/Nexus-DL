# ============================================================================
# NEXUSDL - Project Configuration
# ============================================================================
#
# Ce fichier définit la configuration complète du projet Python NexusDL.
# Il gère les métadonnées, les dépendances, les points d'entrée et la 
# configuration de tous les outils de développement (linting, typing, testing).
#
# Installation en mode développement (avec tous les outils) :
#   pip install -e ".[dev]"
#
# Installation pour la production (backend + CLI) :
#   pip install -e ".[cli,web]"
#
# ============================================================================

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# MÉTADONNÉES DU PROJET
# ============================================================================

[project]
name = "nexusdl"
version = "0.1.0"
description = "Advanced Manga Downloader and Library Manager"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "NexusDL Team", email = "drxenon487@gmail.com" }
]
maintainers = [
    { name = "NexusDL Core Team", email = "drxenon487@gmail.com" }
]
keywords = [
    "manga", "downloader", "library", "manager", "webtoon", 
    "comics", "fastapi", "textual", "pyqt6", "cyberpunk"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
requires-python = ">=3.11"

# CORRECTION 1 : dependencies doit être DANS la section [project]
dependencies = [
    # --- HTTP & Networking ---
    "httpx>=0.27.0",          # Client HTTP asynchrone principal
    "aiohttp>=3.9.0",         # Client HTTP alternatif (certains parsers)
    "websockets>=12.0",       # Client/Serveur WebSocket
    
    # --- Parsing & Scraping ---
    "beautifulsoup4>=4.12.0", # Parsing HTML
    "lxml>=5.0.0",            # Parsing HTML/XML rapide
    "playwright>=1.40.0",     # Rendu JavaScript (Cloudflare bypass)
    
    # --- Data & Validation ---
    "pydantic>=2.5.0",        # Validation des données
    "pydantic-settings>=2.1.0", # Gestion de la configuration via Pydantic
    "pyyaml>=6.0.1",          # Fichiers de configuration YAML
     "jsonschema>=4.20",
    
    # --- Database & Storage ---
    "aiosqlite>=0.19.0",      # Base de données SQLite asynchrone (Library)
    "aiofiles>=23.2.0",       # Opérations fichier asynchrones
    
    # --- Image & Packaging ---
    "pillow>=10.1.0",         # Traitement d'images
    "img2pdf>=0.5.0",         # Conversion images vers PDF
    "zipfile-deflate64>=0.2.0", # Support compression améliorée pour CBZ/ZIP
    
    # --- Web Backend (FastAPI) ---
    "fastapi>=0.109.0",       # Framework API REST
    "uvicorn[standard]>=0.27.0", # Serveur ASGI
    "python-multipart>=0.0.6", # Support des formulaires FastAPI
    "passlib[bcrypt]>=1.7.4", # Hachage des mots de passe
    "pyjwt>=2.8.0",           # Tokens JWT
    
    # --- Logging & Utils ---
    "loguru>=0.7.2",          # Système de logging moderne
    "rich>=13.7.0",           # Affichage terminal riche (fallback CLI)
    "click>=8.1.7",           # CLI simple (pour les commandes rapides)
]

# ============================================================================
# DÉPENDANCES OPTIONNELLES (EXTRAS)
# ============================================================================

[project.optional-dependencies]

# Interface en ligne de commande (TUI)
cli = [
    "textual>=0.47.0",
    "textual-dev>=1.4.0",
]

# Interface graphique desktop
gui = [
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
]

# Développement et tests
dev = [
    # Linting & Formatting
    "ruff>=0.1.9",
    # Type Checking
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
    # Testing
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    # Build & Publish
    "build>=1.0.3",
    "twine>=4.0.2",
]

# Documentation
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.3",
    "mkdocstrings[python]>=0.24.0",
]

# Toutes les dépendances (pour un environnement de dev complet)
all = [
    "nexusdl[cli,gui,dev,docs]",
]

# ============================================================================
# POINTS D'ENTRÉE (CLI)
# ============================================================================

[project.scripts]
nexusdl = "nexusdl.__main__:main"

# ============================================================================
# URLS DU PROJET
# ============================================================================

[project.urls]
"Homepage" = "https://nexusdl.dev"
"Documentation" = "https://github.com/JokerApocalypse-cmd/Nexus-DL#readme"
"Repository" = "https://github.com/JokerApocalypse-cmd/Nexus-DL"
"Issues" = "https://github.com/JokerApocalypse-cmd/Nexus-DL/issues"
"Changelog" = "https://github.com/JokerApocalypse-cmd/Nexus-DL/blob/main/CHANGELOG.md"

# ============================================================================
# CONFIGURATION SETUPTOOLS
# ============================================================================

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexusdl*"]
exclude = ["tests*", "docs*"]

# ============================================================================
# CONFIGURATION RUFF (Linter & Formatter)
# ============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "*.egg-info",
    "src/nexusdl/interfaces/web/frontend", # Géré par ESLint/Prettier
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (tri des imports)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",    # Line too long (géré par le formatter)
    "B008",    # Do not perform function call in argument defaults (normal pour FastAPI Depends)
    "RUF001",  # String contains ambiguous character (acceptable pour les UI)
]

[tool.ruff.lint.isort]
known-first-party = ["nexusdl"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# CONFIGURATION MYPY (Type Checking)
# ============================================================================

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Ignorer les erreurs pour les bibliothèques sans stubs de type
[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "img2pdf",
    "zipfile_deflate64",
    "passlib.*",
]
ignore_missing_imports = true

# ============================================================================
# CONFIGURATION PYTEST (Tests)
# ============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src/nexusdl",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "web: marks tests that require web access",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ============================================================================
# CONFIGURATION COVERAGE
# ============================================================================

[tool.coverage.run]
source = ["src/nexusdl"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == '__main__':",  # CORRECTION 2 : Regex corrigée (guillemets au lieu de points)
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 70.0
show_missing = true
