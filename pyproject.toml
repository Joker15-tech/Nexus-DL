# ============================================================================
# NEXUSDL - Project Configuration
# ============================================================================
#
# Ce fichier définit la configuration complète du projet Python NexusDL.
# Il remplace setup.py et requirements.txt par une configuration moderne.
#
# Installation en mode développement :
#   pip install -e ".[dev]"
#
# Installation pour la production (backend + CLI) :
#   pip install -e ".[cli,web]"
#
# Installation complète (toutes les interfaces) :
#   pip install -e ".[all]"
#
# ============================================================================

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# MÉTADONNÉES DU PROJET
# ============================================================================

[project]
name = "nexusdl"
version = "0.1.0"
description = "Advanced Manga Downloader and Library Manager"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "NexusDL Team", email = "drxenon487@gmail.com" }
]
maintainers = [
    { name = "NexusDL Core Team", email = "drxenon487@gmail.com" }
]
keywords = [
    "manga", "downloader", "library", "manager", "webtoon", 
    "comics", "fastapi", "textual", "pyqt6", "cyberpunk"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
requires-python = ">=3.11"

# ============================================================================
# DÉPENDANCES PRINCIPALES (CORE)
# ============================================================================

dependencies = [
    # --- HTTP & Networking ---
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    
    # --- Parsing & Scraping ---
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    "selectolax>=0.3.21",
    
    # --- Data & Validation ---
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
    
    # --- Database & Storage ---
    "aiosqlite>=0.19.0",
    "aiofiles>=23.2.0",
    "sqlite-utils>=3.38",
    "sqlite-fts4>=1.0.3",
    
    # --- Image & Packaging ---
    "pillow>=10.1.0",
    "img2pdf>=0.5.0",
    "pikepdf>=9.4.2",
    "zipfile-deflate64>=0.2.0",
    
    # --- Web Backend (FastAPI) ---
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
    
    # --- Logging & Utils ---
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "click>=8.1.7",
    "typer>=0.15.0",
    "python-dotenv>=1.0.1",
    "python-slugify>=8.0.4",
    "unidecode>=1.3.8",
    "humanize>=4.11.0",
    "tabulate>=0.9.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
]

# ============================================================================
# DÉPENDANCES OPTIONNELLES (EXTRAS)
# ============================================================================

[project.optional-dependencies]

# Interface en ligne de commande (TUI)
cli = [
    "textual>=0.47.0",
    "textual-dev>=1.4.0",
]

# Interface graphique desktop
gui = [
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
]

# Développement et tests
dev = [
    # Linting & Formatting
    "ruff>=0.1.9",
    # Type Checking
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
    "types-jsonschema>=4.20.0",
    "types-passlib>=1.7.7",
    "types-Pillow>=10.2.0",
    "types-aiofiles>=23.2.0",
    "types-python-dateutil>=2.8.19",
    "types-setuptools>=68.0.0",
    # Testing
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "respx>=0.20.0",
    "aioresponses>=0.7.6",
    "factory-boy>=3.3.0",
    "faker>=22.0.0",
    # Build
    "build>=1.0.3",
    "twine>=4.0.2",
]

# Documentation
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.3",
    "mkdocstrings[python]>=0.24.0",
]

# Toutes les dépendances
all = [
    "nexusdl[cli,gui,dev,docs]",
]

# ============================================================================
# POINTS D'ENTRÉE (CLI)
# ============================================================================

[project.scripts]
nexusdl = "nexusdl.__main__:main"

# ============================================================================
# URLS DU PROJET
# ============================================================================

[project.urls]
"Homepage" = "https://nexusdl.dev"
"Documentation" = "https://github.com/JokerApocalypse-cmd/Nexus-DL#readme"
"Repository" = "https://github.com/JokerApocalypse-cmd/Nexus-DL"
"Issues" = "https://github.com/JokerApocalypse-cmd/Nexus-DL/issues"
"Changelog" = "https://github.com/JokerApocalypse-cmd/Nexus-DL/blob/main/CHANGELOG.md"

# ============================================================================
# CONFIGURATION SETUPTOOLS
# ============================================================================

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexusdl*"]
exclude = ["tests*", "docs*"]

# ============================================================================
# CONFIGURATION RUFF (Linter & Formatter)
# ============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "*.egg-info",
    "src/nexusdl/interfaces/web/frontend",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",  # Line too long
    "B008",  # Function call in argument defaults (FastAPI Depends)
    "RUF001", # Ambiguous characters
]

[tool.ruff.lint.isort]
known-first-party = ["nexusdl"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ============================================================================
# CONFIGURATION MYPY (Type Checking)
# ============================================================================

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "img2pdf",
    "zipfile_deflate64",
    "passlib.*",
    "selectolax.*",
    "sqlite_utils.*",
]
ignore_missing_imports = true

# ============================================================================
# CONFIGURATION PYTEST (Tests)
# ============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src/nexusdl",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "web: marks tests that require web access",
]
asyncio_mode = "auto"

# ============================================================================
# CONFIGURATION COVERAGE
# ============================================================================

[tool.coverage.run]
source = ["src/nexusdl"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
fail_under = 70.0
show_missing = true
