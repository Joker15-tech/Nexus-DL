# ==============================================================================
#  NexusDL — tox.ini
# ==============================================================================
#  Configuration de la matrice de tests multi-environnements.
#  Compatible tox >= 4.23 avec tox-uv pour des installations rapides.
#
#  Usage :
#      tox                     → exécute tous les environnements
#      tox -e py312            → un environnement spécifique
#      tox -e lint,type        → plusieurs environnements
#      tox -p auto             → exécution parallèle
#      tox list                → liste les environnements
#      tox -e py312 -- -k foo  → passe des args à pytest
#      tox --devenv .venv      → crée un venv de dev
#      tox -r                  → recrée les environnements
#      tox -q                  → mode silencieux
#      tox --showconfig        → affiche la config résolue
#
#  Documentation : https://tox.wiki/
#
#  Copyright (C) 2026 NEXUS-QUANTUM
#  SPDX-License-Identifier: GPL-3.0-or-later
# ==============================================================================

[tox]
# Environnements exécutés par défaut
env_list =
    py312
    py313
    py314
    lint
    format
    type
    security
    audit
    docs
    coverage
    e2e
    packaging

# Version minimale de tox
min_version = 4.23.0

# Plugins requis
requires =
    tox>=4.23
    tox-uv>=1.15
    tox-gh-actions>=3.2

# Isolation des environnements
isolated_build = true

# Parallélisation automatique
# (le nombre de workers est déterminé par le nombre de CPU)
# Utilisez `tox -p auto` pour activer

# Répertoire de travail
toxworkdir = {toxinidir}/.tox

# Répertoire temporaire
temp_dir = {toxworkdir}/tmp

# Cache
cachedir = {toxworkdir}/.cache

# Ne pas installer le package dans certains environnements
skipsdist = false

# Labels pour grouper les environnements
labels =
    test = py312, py313, py314
    ci = py312, lint, type, security, docs, coverage
    quality = lint, format, type, security, audit
    release = lint, type, security, coverage, packaging
    all = py312, py313, py314, lint, format, type, security, audit, docs, coverage, e2e, packaging


# ==============================================================================
#  CONFIGURATION DE BASE (héritée par tous les environnements)
# ==============================================================================

[testenv]
description = Exécute les tests avec pytest
runner = uv-venv-lock-runner
with_dev = true
package = wheel
wheel_build_env = .pkg
pass_env =
    CI
    PYTEST_*
    COVERAGE_*
    NO_COLOR
    FORCE_COLOR
set_env =
    PYTHONUNBUFFERED = 1
    PYTHONDONTWRITEBYTECODE = 1
    PYTHONHASHSEED = 0
    PIP_DISABLE_PIP_VERSION_CHECK = 1
    UV_LINK_MODE = copy
commands =
    pytest {posargs:tests}

# Dépendances spécifiques par environnement (héritage)
extras =
    dev


# ==============================================================================
#  ENVIRONNEMENTS PYTHON (tests multi-versions)
# ==============================================================================

[testenv:py312]
description = Tests sur Python 3.12
basepython = python3.12
commands =
    pytest {posargs:tests} --cov --cov-report=term-missing

[testenv:py313]
description = Tests sur Python 3.13
basepython = python3.13
commands =
    pytest {posargs:tests} --cov --cov-report=term-missing

[testenv:py314]
description = Tests sur Python 3.14 (si disponible)
basepython = python3.14
commands =
    pytest {posargs:tests} --cov --cov-report=term-missing


# ==============================================================================
#  ENVIRONNEMENTS QUALITÉ DE CODE
# ==============================================================================

[testenv:lint]
description = Vérifie le lint avec ruff
skip_install = true
extras = dev
commands =
    ruff check src tests scripts
    ruff format --check src tests scripts

[testenv:format]
description = Formate le code avec ruff (mode fix)
skip_install = true
extras = dev
commands =
    ruff check --fix src tests scripts
    ruff format src tests scripts

[testenv:type]
description = Vérifie les types avec mypy strict
extras = dev
commands =
    mypy src/nexusdl

[testenv:type-report]
description = Génère un rapport HTML mypy
extras = dev
commands =
    mypy src/nexusdl --html-report {toxworkdir}/mypy-report
    python -c "import webbrowser; webbrowser.open('{toxworkdir}/mypy-report/index.html')"

[testenv:security]
description = Audit de sécurité (bandit)
skip_install = true
extras = dev
commands =
    bandit -c {toxinidir}/pyproject.toml -r src/nexusdl -f screen
    bandit -c {toxinidir}/pyproject.toml -r src/nexusdl -f json -o {toxworkdir}/bandit-report.json

[testenv:audit]
description = Audit des dépendances (pip-audit + safety)
skip_install = true
extras = dev
commands =
    pip-audit --skip-editable --strict
    safety check --full-report || true

[testenv:complexity]
description = Analyse de complexité (radon)
skip_install = true
extras = dev
commands =
    radon cc src/nexusdl -a -s --total-average
    radon mi src/nexusdl -s
    radon hal src/nexusdl

[testenv:dead-code]
description = Détection de code mort (vulture)
skip_install = true
extras = dev
commands =
    vulture src/nexusdl --min-confidence 80

[testenv:deps]
description = Vérifie les dépendances inutilisées (deptry)
skip_install = true
extras = dev
commands =
    deptry .

[testenv:pre-commit]
description = Exécute tous les hooks pre-commit
skip_install = true
extras = dev
commands =
    pre-commit run --all-files --show-diff-on-failure


# ==============================================================================
#  ENVIRONNEMENTS DE COUVERTURE
# ==============================================================================

[testenv:coverage]
description = Rapport de couverture complet (HTML + XML + term)
extras =
    dev
    all
commands =
    coverage erase
    pytest tests \
        --cov=src/nexusdl \
        --cov-branch \
        --cov-report=term-missing \
        --cov-report=html:{toxworkdir}/htmlcov \
        --cov-report=xml:{toxworkdir}/coverage.xml \
        --cov-fail-under=85
    coverage report --show-missing --skip-covered
    python -c "import webbrowser; webbrowser.open('{toxworkdir}/htmlcov/index.html')"

[testenv:coverage-clean]
description = Nettoie les artefacts de couverture
skip_install = true
commands =
    coverage erase
    python -c "import shutil, pathlib; [shutil.rmtree(p, ignore_errors=True) for p in ['htmlcov', '.coverage', 'coverage.xml']]"


# ==============================================================================
#  ENVIRONNEMENTS DE TEST SPÉCIALISÉS
# ==============================================================================

[testenv:unit]
description = Tests unitaires uniquement (rapides)
extras = dev
commands =
    pytest tests/unit -m "unit" -v

[testenv:integration]
description = Tests d'intégration (réseau mocké)
extras = dev
commands =
    pytest tests/integration -m "integration" -v

[testenv:e2e]
description = Tests end-to-end (réseau réel requis)
extras =
    dev
    all
set_env =
    NEXUSDL_E2E = 1
commands =
    pytest tests/e2e -m "e2e" -v --no-header --timeout=300

[testenv:parsers]
description = Tests des parseurs uniquement
extras = dev
commands =
    pytest tests/integration/test_parsers -v --no-header

[testenv:parser]
description = Teste un parser spécifique (usage : tox -e parser -- mangadex)
extras = dev
commands =
    pytest tests/integration/test_parsers -k "{posargs}" -v

[testenv:slow]
description = Tests lents (marqués slow)
extras = dev
commands =
    pytest tests -m "slow" -v --timeout=600

[testenv:adult]
description = Tests des sites adultes (opt-in)
extras = dev
set_env =
    NEXUSDL_ADULT_TESTS = 1
commands =
    pytest tests -m "adult" -v

[testenv:cloudflare]
description = Tests de bypass Cloudflare
extras = dev
commands =
    pytest tests -m "cloudflare" -v --timeout=300

[testenv:windows]
description = Tests spécifiques Windows
platform = win32
extras = dev
commands =
    pytest tests -m "windows" -v

[testenv:linux]
description = Tests spécifiques Linux
platform = linux
extras = dev
commands =
    pytest tests -m "linux" -v

[testenv:macos]
description = Tests spécifiques macOS
platform = darwin
extras = dev
commands =
    pytest tests -m "macos" -v

[testenv:doctest]
description = Doctests uniquement
extras = dev
commands =
    pytest --doctest-modules src/nexusdl -v

[testenv:stress]
description = Tests de stress (durée longue)
extras = dev
commands =
    pytest tests -m "stress" -v --timeout=1800

[testenv:fuzz]
description = Tests de fuzzing avec hypothesis
extras = dev
commands =
    pytest tests -m "fuzz" -v --hypothesis-show-statistics

[testenv:benchmark]
description = Benchmarks de performance
extras = dev
commands =
    pytest tests/benchmarks --benchmark-only --benchmark-autosave


# ==============================================================================
#  ENVIRONNEMENTS DE DOCUMENTATION
# ==============================================================================

[testenv:docs]
description = Build de la documentation Sphinx
skip_install = true
extras = docs
commands =
    sphinx-build -W -b html -d {toxworkdir}/docs_doctree docs/source {toxworkdir}/docs_html
    python -c "import webbrowser; webbrowser.open('{toxworkdir}/docs_html/index.html')"

[testenv:docs-linkcheck]
description = Vérifie les liens dans la documentation
skip_install = true
extras = docs
commands =
    sphinx-build -W -b linkcheck docs/source {toxworkdir}/docs_linkcheck

[testenv:docs-clean]
description = Nettoie la documentation buildée
skip_install = true
commands =
    python -c "import shutil; [shutil.rmtree(p, ignore_errors=True) for p in ['{toxworkdir}/docs_html', '{toxworkdir}/docs_doctree', 'docs/_build', 'site']]"

[testenv:docs-serve]
description = Sert la documentation localement (hot reload)
skip_install = true
extras = docs
commands =
    mkdocs serve -a localhost:8000


# ==============================================================================
#  ENVIRONNEMENTS DE BUILD & PACKAGING
# ==============================================================================

[testenv:packaging]
description = Vérifie que le package peut être construit et installé
skip_install = true
extras = dev
commands =
    # Nettoie
    python -c "import shutil; [shutil.rmtree(p, ignore_errors=True) for p in ['dist', 'build']]"
    # Build
    python -m build
    # Vérification
    twine check dist/*
    # Test d'installation dans un venv isolé
    python -m venv {toxworkdir}/install-test
    {toxworkdir}/install-test/bin/pip install --quiet dist/*.whl
    {toxworkdir}/install-test/bin/nexusdl --version
    {toxworkdir}/install-test/bin/python -c "import nexusdl; print(nexusdl.__version__)"

[testenv:sdist]
description = Build le sdist uniquement
skip_install = true
extras = dev
commands =
    python -m build --sdist

[testenv:wheel]
description = Build le wheel uniquement
skip_install = true
extras = dev
commands =
    python -m build --wheel

[testenv:verify-sdist]
description = Vérifie le contenu du sdist (fichiers critiques)
skip_install = true
extras = dev
commands =
    python -m build --sdist
    python -c "import tarfile, glob; t = tarfile.open(glob.glob('dist/*.tar.gz')[0]); files = t.getnames(); required = ['src/nexusdl/py.typed', 'src/nexusdl/core/registry/sites.yaml', 'src/nexusdl/data/default_config.yaml', 'LICENSE', 'README.md']; missing = [f for f in required if not any(f in x for x in files)]; print('OK' if not missing else f'MISSING: {missing}'); exit(1 if missing else 0)"


# ==============================================================================
#  ENVIRONNEMENTS DE DÉVELOPPEMENT
# ==============================================================================

[testenv:dev]
description = Crée un environnement de développement complet
skip_install = true
extras =
    dev
    all
commands =
    python -c "print('Environnement de dev prêt dans {envdir}')"

[testenv:repl]
description = Lance un REPL Python dans l'environnement
skip_install = false
extras = dev
commands =
    python -i -c "import nexusdl; from nexusdl import NexusDL; print('NexusDL chargé. Utilise NexusDL() pour commencer.')"

[testenv:ipython]
description = Lance IPython avec auto-imports
skip_install = false
extras = dev
commands =
    ipython --InteractiveShellApp.extensions=autoreload


# ==============================================================================
#  ENVIRONNEMENTS CI/CD
# ==============================================================================

[testenv:ci]
description = Simule la CI complète en local
skip_install = true
extras = dev
commands =
    # Lint
    ruff check src tests scripts
    ruff format --check src tests scripts
    # Types
    mypy src/nexusdl
    # Sécurité
    bandit -c pyproject.toml -r src/nexusdl -q
    pip-audit --skip-editable
    # Tests + couverture
    pytest tests --cov=src/nexusdl --cov-fail-under=85

[testenv:ci-quick]
description = Version rapide de la CI (skip security + coverage)
skip_install = true
extras = dev
commands =
    ruff check src tests scripts
    mypy src/nexusdl
    pytest tests -x -q

[testenv:github-actions]
description = Environnement pour GitHub Actions (via tox-gh-actions)
skip_install = false
extras = dev
commands =
    pytest tests --cov=src/nexusdl --cov-report=xml


# ==============================================================================
#  ENVIRONNEMENTS NEXUS.DL (validation des manifestes)
# ==============================================================================

[testenv:nexus-dl]
description = Valide tous les manifestes nexus.dl
skip_install = true
extras = dev
commands =
    python scripts/validate_nexus_dl.py

[testenv:nexus-dl-generate]
description = Régénère tous les manifestes nexus.dl
skip_install = true
extras = dev
commands =
    python scripts/generate_nexus_manifests.py --root .


# ==============================================================================
#  CONFIGURATION PYTEST (redondance avec pyproject.toml)
# ==============================================================================

[pytest]
minversion = 8.3
testpaths = tests
pythonpath = src
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --doctest-modules
    --doctest-continue-on-failure
    -ra
    --tb=short
    --color=yes
    -p no:cacheprovider
asyncio_mode = auto
timeout = 60
log_cli = false
log_cli_level = INFO
filterwarnings =
    error
    ignore::DeprecationWarning:playwright.*
    ignore::PendingDeprecationWarning
markers =
    unit: Tests unitaires rapides
    integration: Tests d'intégration (réseau mocké)
    e2e: Tests end-to-end (réseau réel)
    slow: Tests lents (>5s)
    stress: Tests de stress
    fuzz: Tests de fuzzing
    network: Tests nécessitant un accès réseau
    adult: Tests sur sites adultes
    cloudflare: Tests avec bypass Cloudflare
    windows: Tests spécifiques Windows
    linux: Tests spécifiques Linux
    macos: Tests spécifiques macOS
    benchmark: Benchmarks de performance


# ==============================================================================
#  CONFIGURATION COVERAGE (redondance avec pyproject.toml)
# ==============================================================================

[coverage:run]
source = src/nexusdl
branch = true
parallel = true
omit =
    */tests/*
    */__main__.py
    */version.py
    src/nexusdl/parsers/custom/_template.py
    src/nexusdl/interfaces/web/frontend/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
sort = Cover
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if self.debug:
    if settings.DEBUG:
    @abstractmethod
    @overload
    class .*\bProtocol\):
    (\.\.\.)

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml


# ==============================================================================
#  CONFIGURATION FLAKE8 (fallback, ruff est préféré)
# ==============================================================================

[flake8]
max-line-length = 100
extend-ignore =
    E203,  # whitespace before ':'
    E501,  # line too long (géré par ruff)
    W503,  # line break before binary operator
    D100,  # missing docstring in public module
    D104,  # missing docstring in public package
exclude =
    .git,
    .venv,
    venv,
    __pycache__,
    build,
    dist,
    node_modules,
    .next,
    .tox,
    .mypy_cache,
    .ruff_cache,
per-file-ignores =
    scripts/*:T201,S
    src/nexusdl/interfaces/cli/*:T201


# ==============================================================================
#  CONFIGURATION PYTEST-BENCHMARK
# ==============================================================================

[benchmark]
min_rounds = 5
max_time = 10
benchmark_autosave = true
benchmark_storage = .benchmarks
benchmark_compare = true


# ==============================================================================
#  CONFIGURATION MYPY (redondance)
# ==============================================================================

[mypy]
python_version = 3.12
files = src/nexusdl
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
show_error_codes = true
pretty = true
color_output = true
namespace_packages = true
explicit_package_bases = true
mypy_path = src
plugins = pydantic.mypy


# ==============================================================================
#  CONFIGURATION RUFF (redondance minimale)
# ==============================================================================

[ruff]
line-length = 100
target-version = py312
src = ["src", "scripts"]


# ==============================================================================
#  CONFIGURATION BANDIT (redondance)
# ==============================================================================

[bandit]
exclude_dirs = tests,scripts,.venv,build,dist
skips = B101,B404,B603,B607


# ==============================================================================
#  CONFIGURATION PIP-AUDIT
# ==============================================================================

[pip-audit]
strict = true
desc = on
progress-spinner = off
require-hashes = false
vulnerability-service = osv


# ==============================================================================
#  NOTES & RAPPELS
# ==============================================================================
#
#  Ce fichier `tox.ini` complète le bloc `[tool.tox]` de `pyproject.toml`.
#
#  PRIORITÉ :
#    - Si `pyproject.toml` contient `[tool.tox]`, tox utilise cette config.
#    - Sinon, tox utilise `tox.ini`.
#    - Les deux peuvent coexister (tox.ini prévaut si les deux existent).
#
#  RECOMMANDATION :
#    - Garder les deux synchronisés.
#    - Utiliser `tox --showconfig` pour vérifier la config effective.
#
#  CONFIGURATION DYNAMIQUE (tox-gh-actions) :
#    La section `[gh-actions]` permet de mapper les versions Python
#    détectées par GitHub Actions aux environnements tox.
#
#  CONFIGURATION DYNAMIQUE (labels) :
#    Utilisez `tox -m test` pour lancer tous les envs de test.
#    Utilisez `tox -m quality` pour lancer tous les envs de qualité.
#
#  EXÉCUTION PARALLÈLE :
#    `tox -p auto` lance les environnements en parallèle.
#    Réduit le temps total de la CI (mais consomme plus de RAM).
#
# ==============================================================================


# ==============================================================================
#  INTÉGRATION GITHUB ACTIONS (tox-gh-actions)
# ==============================================================================

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
# Si le workflow GitHub Actions définit un env, on peut mapper
PLATFORM =
    ubuntu-latest: linux
    windows-latest: windows
    macos-latest: macos


# ==============================================================================
#  FIN DE LA CONFIGURATION
# ==============================================================================
