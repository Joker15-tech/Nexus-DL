# ============================================================================
# NEXUSDL - Tox Configuration
# ============================================================================
# Tox est un outil d'automatisation pour tester le projet dans plusieurs
# environnements Python et exécuter des tâches de développement.
#
# Installation :
#   pip install tox
#
# Utilisation :
#   tox                   # Lance tous les environnements
#   tox -e py312          # Lance uniquement Python 3.12
#   tox -e lint           # Lance uniquement le linting
#   tox -e test           # Lance uniquement les tests
#   tox -e docs           # Génère la documentation
#   tox -l                # Liste tous les environnements
#
# Documentation : https://tox.wiki
# ============================================================================

[tox]
# Versions Python à tester
envlist =
    py311
    py312
    py313
    lint
    mypy
    security
    docs
    build
    clean

# Répertoire de travail
isolated_build = True

# Skip les environnements manquants
skip_missing_interpreters = true

# Utiliser le même environnement virtuel pour les environnements similaires
recreate = false

# ============================================================================
# CONFIGURATION GLOBALE (TESTENV)
# ============================================================================

[testenv]
# Dépendances de base pour tous les environnements de test
deps =
    -r requirements.txt
    pytest>=7.4.4
    pytest-asyncio>=0.23.3
    pytest-cov>=4.1.0
    pytest-mock>=3.12.0
    pytest-xdist>=3.5.0
    pytest-timeout>=2.2.0
    respx>=0.20.0
    aioresponses>=0.7.6
    factory-boy>=3.3.0
    faker>=22.0.0

# Variables d'environnement
setenv =
    PYTHONPATH = {toxinidir}/src
    NEXUSDL_ENV = test
    NEXUSDL_LOG_LEVEL = WARNING
    NEXUSDL_DATA_DIR = {toxinidir}/data/test
    NEXUSDL_CACHE_DIR = {toxinidir}/cache/test
    NEXUSDL_LOG_DIR = {toxinidir}/logs/test
    PYTHONDONTWRITEBYTECODE = 1
    PYTHONUNBUFFERED = 1

# Commande par défaut : pytest
commands =
    pytest {posargs:tests/ -v --tb=short}

# Permettre l'accès aux hôtes externes (pour les tests web)
allowlist_externals =
    pytest
    bash
    sh
    rm
    mkdir

# ============================================================================
# ENVIRONNEMENTS PYTHON SPÉCIFIQUES
# ============================================================================

# Python 3.11
[testenv:py311]
basepython = python3.11
description = Run tests with Python 3.11

# Python 3.12 (recommandé)
[testenv:py312]
basepython = python3.12
description = Run tests with Python 3.12

# Python 3.13
[testenv:py313]
basepython = python3.13
description = Run tests with Python 3.13

# ============================================================================
# TESTS SPÉCIFIQUES
# ============================================================================

# Tests unitaires rapides (sans tests lents)
[testenv:test-fast]
basepython = python3.12
description = Run fast unit tests only
deps = {[testenv]deps}
commands =
    pytest tests/ -v --tb=short -m "not slow" -x

# Tests unitaires complets
[testenv:test]
basepython = python3.12
description = Run all unit tests
deps = {[testenv]deps}
commands =
    pytest tests/ -v --tb=short

# Tests avec couverture
[testenv:test-cov]
basepython = python3.12
description = Run tests with coverage report
deps = {[testenv]deps}
commands =
    pytest tests/ \
        --cov=src/nexusdl \
        --cov-report=term-missing \
        --cov-report=html:htmlcov \
        --cov-report=xml:coverage.xml \
        -v --tb=short

# Tests d'intégration
[testenv:test-integration]
basepython = python3.12
description = Run integration tests
deps = {[testenv]deps}
commands =
    pytest tests/ -v -m "integration" --tb=short

# Tests end-to-end
[testenv:test-e2e]
basepython = python3.12
description = Run end-to-end tests
deps =
    {[testenv]deps}
    playwright>=1.40.0
commands =
    playwright install chromium
    pytest tests/e2e/ -v -m "e2e" --tb=short

# Tests web (nécessitent un accès internet)
[testenv:test-web]
basepython = python3.12
description = Run web tests (requires internet)
deps = {[testenv]deps}
commands =
    pytest tests/ -v -m "web" --tb=short

# Tests en watch mode (re-exécute à chaque modification)
[testenv:test-watch]
basepython = python3.12
description = Run tests in watch mode
deps =
    {[testenv]deps}
    pytest-watch>=4.2.0
commands =
    ptw --runner pytest -- tests/ -v

# ============================================================================
# LINTING & QUALITÉ DU CODE
# ============================================================================

# Linting complet (Ruff + MyPy + Pylint)
[testenv:lint]
basepython = python3.12
description = Run all linters
skip_install = true
deps =
    ruff>=0.1.9
    mypy>=1.8.0
    pylint>=3.0.0
    types-PyYAML>=6.0.12
    types-requests>=2.31.0
    types-beautifulsoup4>=4.12.0
    types-jsonschema>=4.20.0
    types-passlib>=1.7.7
    types-Pillow>=10.2.0
    types-aiofiles>=23.2.0
    types-python-dateutil>=2.8.19
    types-setuptools>=68.0.0
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/
    mypy src/nexusdl --ignore-missing-imports
    pylint src/nexusdl --disable=C0114,C0115,C0116

# Ruff uniquement (lint + format)
[testenv:ruff]
basepython = python3.12
description = Run Ruff linter and formatter
skip_install = true
deps =
    ruff>=0.1.9
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

# Ruff avec auto-fix
[testenv:ruff-fix]
basepython = python3.12
description = Run Ruff with auto-fix
skip_install = true
deps =
    ruff>=0.1.9
commands =
    ruff check --fix src/ tests/
    ruff format src/ tests/

# MyPy (type checking)
[testenv:mypy]
basepython = python3.12
description = Run MyPy type checker
deps =
    mypy>=1.8.0
    types-PyYAML>=6.0.12
    types-requests>=2.31.0
    types-beautifulsoup4>=4.12.0
    types-jsonschema>=4.20.0
    types-passlib>=1.7.7
    types-Pillow>=10.2.0
    types-aiofiles>=23.2.0
    types-python-dateutil>=2.8.19
    types-setuptools>=68.0.0
commands =
    mypy src/nexusdl --ignore-missing-imports

# Pylint (analyse statique)
[testenv:pylint]
basepython = python3.12
description = Run Pylint static analysis
deps =
    pylint>=3.0.0
commands =
    pylint src/nexusdl --disable=C0114,C0115,C0116

# ============================================================================
# SÉCURITÉ
# ============================================================================

# Audit de sécurité complet
[testenv:security]
basepython = python3.12
description = Run security checks
skip_install = true
deps =
    bandit>=1.7.5
    pip-audit>=2.6.1
    safety>=2.3.10
commands =
    bandit -r src/nexusdl -ll -ii
    pip-audit
    safety check

# Bandit uniquement
[testenv:bandit]
basepython = python3.12
description = Run Bandit security linter
skip_install = true
deps =
    bandit>=1.7.5
commands =
    bandit -r src/nexusdl -ll -ii

# pip-audit (vulnérabilités des dépendances)
[testenv:pip-audit]
basepython = python3.12
description = Audit Python dependencies for vulnerabilities
skip_install = true
deps =
    pip-audit>=2.6.1
commands =
    pip-audit

# ============================================================================
# DOCUMENTATION
# ============================================================================

# Générer la documentation
[testenv:docs]
basepython = python3.12
description = Build documentation with MkDocs
skip_install = true
deps =
    mkdocs>=1.5.3
    mkdocs-material>=9.5.3
    mkdocstrings[python]>=0.24.0
commands =
    mkdocs build --clean

# Servir la documentation en local
[testenv:docs-serve]
basepython = python3.12
description = Serve documentation locally
skip_install = true
deps =
    mkdocs>=1.5.3
    mkdocs-material>=9.5.3
    mkdocstrings[python]>=0.24.0
commands =
    mkdocs serve --dev-addr localhost:8001

# ============================================================================
# BUILD & PUBLISH
# ============================================================================

# Build du package Python
[testenv:build]
basepython = python3.12
description = Build Python package (sdist + wheel)
skip_install = true
deps =
    build>=1.0.3
    twine>=4.0.2
commands =
    python -m build --sdist --wheel --outdir dist/
    twine check dist/*

# Publier sur PyPI (test)
[testenv:publish-test]
basepython = python3.12
description = Publish package to TestPyPI
skip_install = true
deps =
    twine>=4.0.2
commands =
    twine upload --repository testpypi dist/*

# Publier sur PyPI (production)
[testenv:publish]
basepython = python3.12
description = Publish package to PyPI
skip_install = true
deps =
    twine>=4.0.2
commands =
    twine upload dist/*

# ============================================================================
# FRONTEND (via pnpm)
# ============================================================================

# Installer les dépendances frontend
[testenv:frontend-install]
basepython = python3.12
description = Install frontend dependencies
skip_install = true
allowlist_externals =
    pnpm
commands =
    pnpm install --dir src/nexusdl/interfaces/web/frontend

# Lint frontend
[testenv:frontend-lint]
basepython = python3.12
description = Lint frontend code
skip_install = true
allowlist_externals =
    pnpm
commands =
    pnpm lint --dir src/nexusdl/interfaces/web/frontend
    pnpm format:check --dir src/nexusdl/interfaces/web/frontend

# Build frontend
[testenv:frontend-build]
basepython = python3.12
description = Build frontend for production
skip_install = true
allowlist_externals =
    pnpm
commands =
    pnpm build --dir src/nexusdl/interfaces/web/frontend

# ============================================================================
# NETTOYAGE
# ============================================================================

# Nettoyer tous les fichiers temporaires
[testenv:clean]
basepython = python3.12
description = Clean all temporary files
skip_install = true
allowlist_externals =
    rm
    find
commands =
    rm -rf dist/ build/ *.egg-info
    rm -rf htmlcov/ coverage.xml .coverage
    rm -rf .pytest_cache/ .mypy_cache/ .ruff_cache/ .pylint_cache/
    rm -rf .tox/
    find . -type d -name "__pycache__" -exec rm -rf {} +
    find . -type f -name "*.pyc" -delete
    find . -type f -name "*.pyo" -delete

# Nettoyer uniquement les caches Python
[testenv:clean-python]
basepython = python3.12
description = Clean Python caches only
skip_install = true
allowlist_externals =
    rm
    find
commands =
    find . -type d -name "__pycache__" -exec rm -rf {} +
    find . -type f -name "*.pyc" -delete
    find . -type f -name "*.pyo" -delete
    rm -rf .pytest_cache/ .mypy_cache/ .ruff_cache/ .pylint_cache/

# ============================================================================
# ENVIRONNEMENTS COMBINÉS
# ============================================================================

# CI/CD : Tous les checks avant déploiement
[testenv:ci]
basepython = python3.12
description = Run all CI checks (lint + test + security)
deps =
    {[testenv:lint]deps}
    {[testenv:test]deps}
    {[testenv:security]deps}
commands =
    {[testenv:lint]commands}
    {[testenv:test-cov]commands}
    {[testenv:security]commands}

# Développement : Setup complet
[testenv:dev-setup]
basepython = python3.12
description = Setup development environment
deps =
    -r requirements-dev.txt
commands =
    python -m playwright install chromium
    python -m playwright install-deps chromium
    pre-commit install
    pre-commit install --hook-type commit-msg

# Release : Build + tests + sécurité
[testenv:release]
basepython = python3.12
description = Prepare for release
deps =
    {[testenv:build]deps}
    {[testenv:test]deps}
    {[testenv:security]deps}
commands =
    {[testenv:test]commands}
    {[testenv:security]commands}
    {[testenv:build]commands}

# ============================================================================
# DÉPLOIEMENT
# ============================================================================

# Déployer sur Railway (via CLI)
[testenv:deploy-railway]
basepython = python3.12
description = Deploy to Railway
skip_install = true
allowlist_externals =
    railway
commands =
    railway up

# Déployer sur Netlify (via CLI)
[testenv:deploy-netlify]
basepython = python3.12
description = Deploy frontend to Netlify
skip_install = true
allowlist_externals =
    pnpm
    netlify
commands =
    pnpm build --dir src/nexusdl/interfaces/web/frontend
    netlify deploy --prod --dir src/nexusdl/interfaces/web/frontend/.next

# ============================================================================
# UTILITAIRES
# ============================================================================

# Afficher les informations du système
[testenv:info]
basepython = python3.12
description = Show system information
skip_install = true
allowlist_externals =
    python
    node
    pnpm
    docker
commands =
    python --version
    node --version
    pnpm --version
    docker --version

# Générer une nouvelle clé secrète
[testenv:generate-secret]
basepython = python3.12
description = Generate a new secret key
commands =
    python -c "import secrets; print(secrets.token_urlsafe(64))"

# Générer une nouvelle clé API
[testenv:generate-api-key]
basepython = python3.12
description = Generate a new API key
commands =
    python -c "import secrets; print('nxd_' + secrets.token_hex(32))"

# ============================================================================
# CONFIGURATION PYTEST
# ============================================================================

[pytest]
# Chemins de test
testpaths = tests

# Patterns de fichiers de test
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short

# Marqueurs de test
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    web: marks tests that require web access
    unit: marks tests as unit tests

# Mode asyncio
asyncio_mode = auto

# ============================================================================
# CONFIGURATION COVERAGE
# ============================================================================

[coverage:run]
source = src/nexusdl
branch = True
omit =
    */tests/*
    */__init__.py
    */__main__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
fail_under = 70.0
show_missing = True

[coverage:html]
directory = htmlcov

# ============================================================================
# CONFIGURATION MYPY
# ============================================================================

[mypy]
python_version = 3.12
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-img2pdf]
ignore_missing_imports = True

[mypy-zipfile_deflate64]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-selectolax.*]
ignore_missing_imports = True

[mypy-sqlite_utils.*]
ignore_missing_imports = True

# ============================================================================
# CONFIGURATION RUFF
# ============================================================================

[ruff]
target-version = py312
line-length = 100
extend-exclude =
    .git
    __pycache__
    .venv
    venv
    env
    build
    dist
    *.egg-info
    src/nexusdl/interfaces/web/frontend

[ruff.lint]
select =
    E,      # pycodestyle errors
    W,      # pycodestyle warnings
    F,      # pyflakes
    I,      # isort
    N,      # pep8-naming
    UP,     # pyupgrade
    B,      # flake8-bugbear
    C4,     # flake8-comprehensions
    PT,     # flake8-pytest-style
    RUF,    # ruff-specific rules
    TCH     # flake8-type-checking

ignore =
    E501,   # Line too long
    B008,   # Function call in argument defaults
    RUF001  # Ambiguous characters

[ruff.lint.isort]
known-first-party = nexusdl

[ruff.format]
quote-style = double
indent-style = space
line-ending = auto

# ============================================================================
# FIN DU FICHIER
# ============================================================================
