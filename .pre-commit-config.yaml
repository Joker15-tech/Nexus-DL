# ============================================================================
# NEXUSDL - Pre-commit Configuration
# ============================================================================
# Ce fichier configure les hooks Git qui s'exécutent automatiquement avant
# chaque commit pour garantir la qualité du code.
#
# Installation :
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# Exécution manuelle :
#   pre-commit run --all-files
#
# Mise à jour des hooks :
#   pre-commit autoupdate
#
# Documentation : https://pre-commit.com
# ============================================================================

# Version minimale de pre-commit requise
minimum_pre_commit_version: "3.0.0"

# Répertoire de cache des hooks
default_language_version:
  python: python3.12
  node: "20"

# ============================================================================
# HOOKS STANDARDS (pré-commit)
# ============================================================================
repos:
  # --------------------------------------------------------------------------
  # HOOKS GÉNÉRAUX (fichiers texte, fins de ligne, etc.)
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Supprime les espaces en fin de ligne
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      
      # Assure une ligne vide à la fin des fichiers
      - id: end-of-file-fixer
      
      # Convertit les fins de ligne en LF (sauf pour les fichiers Windows)
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^.*\.(bat|cmd|ps1|psm1|psd1)$
      
      # Vérifie la validité des fichiers YAML
      - id: check-yaml
        args: [--allow-multiple-documents]
      
      # Vérifie la validité des fichiers JSON
      - id: check-json
      
      # Vérifie la validité des fichiers TOML
      - id: check-toml
      
      # Vérifie la validité des fichiers XML
      - id: check-xml
      
      # Vérifie la validité des fichiers mergés
      - id: check-merge-conflict
      
      # Vérifie qu'il n'y a pas de conflits de cas (Windows/macOS)
      - id: check-case-conflict
      
      # Vérifie qu'il n'y a pas de fichiers avec des espaces dans le nom
      - id: check-executables-have-shebangs
      
      # Vérifie les shebangs des scripts
      - id: check-shebang-scripts-are-executable
      
      # Détecte les fichiers avec des caractères spéciaux Windows
      - id: check-added-large-files
        args: [--maxkb=1000]
      
      # Détecte les clés privées
      - id: detect-private-key
      
      # Empêche l'ajout de fichiers de conflits Git
      - id: forbid-new-submodules
      
      # Trie les requirements.txt
      - id: requirements-txt-fixer
      
      # Vérifie les liens cassés dans les fichiers
      - id: fix-encoding-pragma
        args: [--remove]

  # --------------------------------------------------------------------------
  # PYTHON - RUFF (Linter & Formatter ultra-rapide)
  # --------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      # Ruff linter
      - id: ruff
        args: [
          --fix,
          --exit-non-zero-on-fix,
          --show-fixes,
        ]
        types_or: [python, pyi, jupyter]
      
      # Ruff formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  # --------------------------------------------------------------------------
  # PYTHON - MYPY (Type checking)
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [
          --ignore-missing-imports,
          --scripts-are-modules,
        ]
        additional_dependencies:
          - types-PyYAML
          - types-requests
          - types-beautifulsoup4
          - types-jsonschema
          - types-passlib
          - types-Pillow
          - types-aiofiles
          - types-python-dateutil
          - types-setuptools
        exclude: ^(tests/|docs/)

  # --------------------------------------------------------------------------
  # PYTHON - PYTEST (Tests)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        args: [
          tests/,
          -v,
          --tb=short,
          -x,
          --disable-warnings,
        ]

  # --------------------------------------------------------------------------
  # PYTHON - PYLINT (Analyse statique complémentaire)
  # --------------------------------------------------------------------------
  - repo: https://github.com/pycqa/pylint
    rev: v3.3.2
    hooks:
      - id: pylint
        args: [
          --disable=C0114,C0115,C0116,  # Désactive les warnings de docstrings manquantes
          --max-line-length=100,
        ]
        exclude: ^(tests/|docs/)

  # --------------------------------------------------------------------------
  # SÉCURITÉ - Bandit (Analyse de sécurité Python)
  # --------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [
          -r,
          src/nexusdl,
          --severity-level=medium,
          --confidence-level=medium,
        ]
        additional_dependencies: ["bandit[toml]"]

  # --------------------------------------------------------------------------
  # SÉCURITÉ - Detect-secrets (Détection de secrets)
  # --------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [
          --baseline,
          .secrets.baseline,
        ]
        exclude: ^(package-lock\.json|pnpm-lock\.yaml|\.env\.example)$

  # --------------------------------------------------------------------------
  # SÉCURITÉ - pip-audit (Audit des dépendances Python)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: pip-audit
        language: system
        pass_filenames: false
        always_run: true
        args: [
          --require-hashes,
          --desc,
        ]

  # --------------------------------------------------------------------------
  # FRONTEND - ESLint (Linter JavaScript/TypeScript)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd src/nexusdl/interfaces/web/frontend && pnpm eslint --fix "${@/#src\/nexusdl\/interfaces\/web\/frontend\//}"'
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^src/nexusdl/interfaces/web/frontend/

  # --------------------------------------------------------------------------
  # FRONTEND - Prettier (Formatter)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd src/nexusdl/interfaces/web/frontend && pnpm prettier --write "${@/#src\/nexusdl\/interfaces\/web\/frontend\//}"'
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, scss, sass, less, html, markdown, yaml]
        files: ^src/nexusdl/interfaces/web/frontend/

  # --------------------------------------------------------------------------
  # FRONTEND - Stylelint (Linter CSS/SCSS)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: stylelint
        name: stylelint
        entry: bash -c 'cd src/nexusdl/interfaces/web/frontend && pnpm stylelint --fix "${@/#src\/nexusdl\/interfaces\/web\/frontend\//}"'
        language: system
        types_or: [css, scss, sass, less]
        files: ^src/nexusdl/interfaces/web/frontend/

  # --------------------------------------------------------------------------
  # MARKDOWN - Markdownlint
  # --------------------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [
          --fix,
          --ignore,
          CHANGELOG.md,
        ]

  # --------------------------------------------------------------------------
  # DOCKER - Hadolint (Linter Dockerfile)
  # --------------------------------------------------------------------------
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint
        args: [
          --ignore,
          DL3008,  # Ignore "Pin versions in apt get install"
          --ignore,
          DL3013,  # Ignore "Pin versions in pip"
        ]

  # --------------------------------------------------------------------------
  # SHELL - ShellCheck (Linter Bash)
  # --------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [
          --severity=warning,
        ]

  # --------------------------------------------------------------------------
  # GIT - Commit message convention
  # --------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # --------------------------------------------------------------------------
  # GIT - Conventional commits
  # --------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [
          feat,      # Nouvelle fonctionnalité
          fix,       # Correction de bug
          docs,      # Documentation
          style,     # Formatage
          refactor,  # Refactorisation
          perf,      # Performance
          test,      # Tests
          build,     # Build
          ci,        # CI/CD
          chore,     # Tâches diverses
          revert,    # Revert
        ]

  # --------------------------------------------------------------------------
  # GIT - GPG signature (optionnel)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-gpg
        name: check-gpg-signature
        entry: bash -c 'git config --get commit.gpgsign || echo "GPG signing not enabled"'
        language: system
        pass_filenames: false
        always_run: true

  # --------------------------------------------------------------------------
  # UTILITAIRES - Codespell (Correction d'orthographe)
  # --------------------------------------------------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [
          --skip,
          "*.lock,*.min.js,*.min.css,pnpm-lock.yaml,package-lock.json",
          --ignore-words,
          .codespell-ignore,
        ]

  # --------------------------------------------------------------------------
  # UTILITAIRES - Typos (Correction d'orthographe rapide)
  # --------------------------------------------------------------------------
  - repo: https://github.com/crate-ci/typos
    rev: v1.28.1
    hooks:
      - id: typos

  # --------------------------------------------------------------------------
  # UTILITAIRES - Gitleaks (Détection de secrets dans l'historique Git)
  # --------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --------------------------------------------------------------------------
  # UTILITAIRES - Checkov (Infrastructure as Code security)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: checkov
        name: checkov
        entry: checkov
        language: system
        files: \.(tf|yml|yaml|json)$
        args: [
          --quiet,
          --compact,
        ]

  # --------------------------------------------------------------------------
  # UTILITAIRES - Docker compose validation
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: docker-compose-check
        name: docker-compose-check
        entry: docker compose config
        language: system
        files: docker-compose\.(yml|yaml)$
        pass_filenames: false
        always_run: true
