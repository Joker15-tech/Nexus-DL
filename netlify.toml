# ============================================================================
# NEXUSDL FRONTEND - Configuration Netlify (VERSION FINALE)
# ============================================================================
# Frontend : https://nexusdldev.netlify.app
# Backend  : https://nexus-dl-production.up.railway.app
# GitHub   : https://github.com/JokerApocalypse-cmd/Nexus-DL
# ============================================================================

# ============================================================================
# BUILD CONFIGURATION
# ============================================================================
[build]
  # ⚠️ CRUCIAL : Dossier contenant le package.json du frontend Next.js
  base = "src/nexusdl/interfaces/web/frontend"

  # Commande de build (Netlify détecte pnpm via pnpm-lock.yaml)
  command = "pnpm build"

  # Répertoire de publication (géré par le plugin Next.js)
  publish = ".next"

# ============================================================================
# VARIABLES D'ENVIRONNEMENT DE BUILD
# ============================================================================
[build.environment]
  # Version de Node.js (LTS recommandée pour Next.js 14+)
  NODE_VERSION = "20"

  # Active pnpm via Corepack
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"

  # URL de l'API (chemin relatif pour profiter du proxy Netlify → évite le CORS)
  NEXT_PUBLIC_API_URL = "/api/v1"

  # ⚠️ WebSocket : connexion DIRECTE vers Railway (Netlify ne proxyfie pas les WS)
  NEXT_PUBLIC_WS_URL = "wss://nexus-dl-production.up.railway.app/ws"

  # Méta-données de l'application
  NEXT_PUBLIC_APP_NAME = "NexusDL"
  NEXT_PUBLIC_APP_VERSION = "0.1.0"

# ============================================================================
# PLUGINS
# ============================================================================
[[plugins]]
  # Plugin officiel Next.js pour Netlify (INDISPENSABLE)
  # Gère l'App Router, le SSR, les optimisations d'images, les rewrites, etc.
  package = "@netlify/plugin-nextjs"

# ============================================================================
# REDIRECTIONS (Proxy API vers Railway pour contourner le CORS)
# ============================================================================

# 1. Proxy pour l'API REST
# Frontend appelle : https://nexusdldev.netlify.app/api/v1/...
# Netlify transmet à : https://nexus-dl-production.up.railway.app/api/v1/...
[[redirects]]
  from = "/api/v1/*"
  to = "https://nexus-dl-production.up.railway.app/api/v1/:splat"
  status = 200
  force = true

# 2. Proxy pour les endpoints de santé
[[redirects]]
  from = "/health"
  to = "https://nexus-dl-production.up.railway.app/health"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "https://nexus-dl-production.up.railway.app/health/:splat"
  status = 200
  force = true

# 3. Proxy pour la documentation Swagger UI
[[redirects]]
  from = "/docs"
  to = "https://nexus-dl-production.up.railway.app/docs"
  status = 200
  force = true

[[redirects]]
  from = "/docs/*"
  to = "https://nexus-dl-production.up.railway.app/docs/:splat"
  status = 200
  force = true

# 4. Proxy pour OpenAPI JSON
[[redirects]]
  from = "/openapi.json"
  to = "https://nexus-dl-production.up.railway.app/openapi.json"
  status = 200
  force = true

# 5. Proxy pour ReDoc
[[redirects]]
  from = "/redoc"
  to = "https://nexus-dl-production.up.railway.app/redoc"
  status = 200
  force = true

# 6. Proxy pour la racine de l'API (infos générales)
[[redirects]]
  from = "/api"
  to = "https://nexus-dl-production.up.railway.app/"
  status = 200
  force = true

# 7. Fallback SPA : toutes les routes non-API vers le frontend Next.js
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================================
# EN-TÊTES DE SÉCURITÉ (Security Headers)
# ============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Empêche l'incorporation dans des iframes (anti-clickjacking)
    X-Frame-Options = "DENY"
    # Empêche le navigateur de deviner le type MIME (anti-sniffing)
    X-Content-Type-Options = "nosniff"
    # Protection XSS basique pour les anciens navigateurs
    X-XSS-Protection = "1; mode=block"
    # Politique de referer stricte pour la confidentialité
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Désactive l'accès aux API matérielles non nécessaires
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # HSTS : Force HTTPS (Netlify fournit déjà le SSL)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy (CSP)
    # ⚠️ IMPORTANT : autorise explicitement le backend Railway pour les connexions
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://nexus-dl-production.up.railway.app wss://nexus-dl-production.up.railway.app https: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"

# ============================================================================
# EN-TÊTES SPÉCIFIQUES POUR LES ASSETS STATIQUES (cache long)
# ============================================================================
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================================
# EN-TÊTES POUR LES IMAGES (cache moyen)
# ============================================================================
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
