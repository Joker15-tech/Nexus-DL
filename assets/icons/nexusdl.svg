<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200"
     width="200"
     height="200"
     role="img"
     aria-label="NexusDL logo">

  <defs>
    <!-- Dégradé principal : violet → cyan -->
    <linearGradient id="nexusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Dégradé de fond -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </radialGradient>

    <!-- Ombre portée -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Lueur -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond circulaire -->
  <circle cx="100" cy="100" r="95"
          fill="url(#bgGradient)"
          stroke="url(#nexusGradient)"
          stroke-width="2"
          opacity="0.9"/>

  <!-- Hexagone central (Nexus = connexions) -->
  <g filter="url(#shadow)">
    <polygon points="100,30 160,65 160,135 100,170 40,135 40,65"
             fill="none"
             stroke="url(#nexusGradient)"
             stroke-width="3"
             stroke-linejoin="round"
             opacity="0.8"/>
  </g>

  <!-- Lettre N stylisée -->
  <g filter="url(#glow)">
    <path d="M 70 70 L 70 130 L 85 130 L 85 95 L 115 130 L 130 130 L 130 70 L 115 70 L 115 105 L 85 70 Z"
          fill="url(#nexusGradient)"/>
  </g>

  <!-- Nœuds du réseau (points aux sommets) -->
  <g fill="#06b6d4">
    <circle cx="100" cy="30"  r="4" filter="url(#glow)"/>
    <circle cx="160" cy="65"  r="4" filter="url(#glow)"/>
    <circle cx="160" cy="135" r="4" filter="url(#glow)"/>
    <circle cx="100" cy="170" r="4" filter="url(#glow)"/>
    <circle cx="40"  cy="135" r="4" filter="url(#glow)"/>
    <circle cx="40"  cy="65"  r="4" filter="url(#glow)"/>
  </g>

  <!-- Lignes de connexion (Nexus) -->
  <g stroke="#a78bfa" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="30"  x2="100" y2="170"/>
    <line x1="40"  y1="65"  x2="160" y2="135"/>
    <line x1="160" y1="65"  x2="40"  y2="135"/>
  </g>

</svg>
