; ============================================================================
; NEXUSDL GUI - Supervisor Configuration
; ============================================================================
; Gère tous les processus nécessaires à la GUI :
;   1. Xvfb (serveur d'affichage virtuel)
;   2. Fluxbox (gestionnaire de fenêtres)
;   3. x11vnc (serveur VNC)
;   4. websockify (proxy WebSocket → VNC)
;   5. NexusDL GUI (l'application PyQt6)
; ============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
stdout_logfile=/var/log/supervisor/%(program_name)s-stdout.log
stderr_logfile=/var/log/supervisor/%(program_name)s-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ============================================================================
; 1. Xvfb - Serveur d'affichage virtuel
; ============================================================================
[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -ac +extension GLX +render -noreset
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb-stdout.log
stderr_logfile=/var/log/supervisor/xvfb-stderr.log

; ============================================================================
; 2. Fluxbox - Gestionnaire de fenêtres léger
; ============================================================================
[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY="%(ENV_DISPLAY)s"
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/var/log/supervisor/fluxbox-stdout.log
stderr_logfile=/var/log/supervisor/fluxbox-stderr.log

; ============================================================================
; 3. x11vnc - Serveur VNC
; ============================================================================
[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -rfbport %(ENV_VNC_PORT)s -passwd %(ENV_VNC_PASSWORD)s -noxdamage -noxfixes -noxrecord -wait 5 -ncache 0
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/supervisor/x11vnc-stdout.log
stderr_logfile=/var/log/supervisor/x11vnc-stderr.log

; ============================================================================
; 4. websockify - Proxy WebSocket → VNC (pour noVNC)
; ============================================================================
[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autostart=true
autorestart=true
priority=40
startsecs=3
stdout_logfile=/var/log/supervisor/websockify-stdout.log
stderr_logfile=/var/log/supervisor/websockify-stderr.log

; ============================================================================
; 5. NexusDL GUI - L'application PyQt6
; ============================================================================
[program:nexusdl-gui]
command=/usr/local/bin/python -m nexusdl --gui
directory=/app
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/root",QT_QPA_PLATFORM="xcb",PYTHONPATH="/app/src:/app"
autostart=true
autorestart=true
priority=50
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/nexusdl-gui-stdout.log
stderr_logfile=/var/log/supervisor/nexusdl-gui-stderr.log
stdout_capture_maxbytes=10MB
stderr_capture_maxbytes=10MB
