# ============================================================================
# NEXUSDL - Docker Compose (Développement Local)
# ============================================================================
# Usage :
#   cd docker
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml logs -f
#   docker compose -f docker-compose.dev.yml down
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # BACKEND (FastAPI + Playwright) - Avec Hot-Reload
  # ============================================================================
  backend:
    image: python:3.12-slim
    container_name: nexusdl-backend-dev
    working_dir: /app
    
    ports:
      - "8000:8000"
      
    volumes:
      # Monter le code source pour le hot-reload (uvicorn --reload)
      - ../src:/app/src
      - ../pyproject.toml:/app/pyproject.toml
      - ../requirements.txt:/app/requirements.txt
      - ../requirements-web.txt:/app/requirements-web.txt
      
      # Données persistantes (téléchargements, base SQLite, logs)
      - nexusdl-dev-data:/app/data
      - nexusdl-dev-logs:/app/logs
      
      # Cache Playwright (évite de retélécharger Chromium à chaque démarrage)
      - playwright-cache:/root/.cache/ms-playwright
      
    environment:
      - NEXUSDL_ENV=development
      - NEXUSDL_LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright
      
    # Charge les variables depuis le fichier .env à la racine du projet
    env_file:
      - ../.env
      
    # Installation des dépendances au démarrage + lancement avec hot-reload
    command: >
      sh -c "
        set -e
        echo '🔧 Installation des dépendances Python...'
        pip install --upgrade pip
        if [ -f requirements-web.txt ]; then
          pip install -r requirements-web.txt
        else
          pip install -r requirements.txt
        fi
        pip install -e .
        
        echo '🔧 Installation des dépendances Playwright (si nécessaire)...'
        playwright install --with-deps chromium
        
        echo '🚀 Démarrage du backend FastAPI avec hot-reload...'
        uvicorn nexusdl.interfaces.web.backend.main:app \
          --host 0.0.0.0 \
          --port 8000 \
          --reload \
          --reload-dir /app/src \
          --proxy-headers \
          --forwarded-allow-ips '*'
      "
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # FRONTEND (Next.js) - Avec Hot-Reload
  # ============================================================================
  frontend:
    image: node:20-alpine
    container_name: nexusdl-frontend-dev
    working_dir: /app
    
    ports:
      - "3000:3000"
      
    volumes:
      # Monter le code source frontend pour le hot-reload
      - ../src/nexusdl/interfaces/web/frontend:/app
      
      # Empêcher le montage du dossier node_modules de l'hôte (conflit Linux/Windows)
      - /app/node_modules
      
      # Cache pnpm (accélère considérablement les démarrages suivants)
      - pnpm-store:/pnpm/store
      
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NEXT_PUBLIC_APP_NAME=NexusDL
      - NEXT_PUBLIC_APP_VERSION=0.1.0
      
    env_file:
      - ../.env
      
    # Activation de pnpm + installation + démarrage en mode dev
    command: >
      sh -c "
        set -e
        echo '🔧 Activation de corepack et pnpm...'
        corepack enable
        corepack prepare pnpm@latest --activate
        
        echo '🔧 Installation des dépendances Node.js...'
        pnpm install
        
        echo '🚀 Démarrage du frontend Next.js avec hot-reload...'
        pnpm dev
      "
      
    restart: unless-stopped
    
    # Attendre que le backend soit prêt avant de démarrer le frontend
    depends_on:
      backend:
        condition: service_healthy

# ============================================================================
# VOLUMES PERSISTANTS (pour accélérer le dev et conserver les données)
# ============================================================================
volumes:
  nexusdl-dev-data:
    driver: local
  nexusdl-dev-logs:
    driver: local
  playwright-cache:
    driver: local
  pnpm-store:
    driver: local
