# ============================================================================
# NEXUSDL - Docker Compose (Production / Staging)
# ============================================================================
# Ce fichier orchestre le déploiement complet de l'application web (Backend + Frontend).
# Il utilise le Dockerfile.web pour une image unique, légère et optimisée.
#
# Usage :
#   cd docker
#   docker compose up -d --build    # Construire et démarrer en arrière-plan
#   docker compose logs -f          # Voir les logs en temps réel
#   docker compose down             # Arrêter l'application
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # APPLICATION WEB PRINCIPALE (FastAPI + Next.js)
  # ==========================================================================
  nexusdl-web:
    build:
      # Le contexte est la racine du projet pour accéder à tous les fichiers
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: nexusdl-web
    restart: unless-stopped
    
    # Exposition du port (hôte:conteneur)
    ports:
      - "8000:8000"
      
    # Volumes persistants pour conserver les données entre les redémarrages
    volumes:
      # Données utilisateurs (Base SQLite, téléchargements, bibliothèque)
      - nexusdl-data:/app/data
      # Logs de l'application
      - nexusdl-logs:/app/logs
      # Cache temporaire et Playwright (accélère les redémarrages)
      - nexusdl-cache:/app/cache
      - playwright-cache:/root/.cache/ms-playwright
      
    # Chargement des variables d'environnement depuis le fichier .env à la racine
    env_file:
      - ../.env
      
    # Variables d'environnement critiques (override si nécessaire)
    environment:
      - NEXUSDL_ENV=production
      - NEXUSDL_LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      
    # Vérification de santé pour s'assurer que l'app est prête
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Temps accordé à Playwright et à l'app pour démarrer
      
    # Réseau isolé pour la sécurité
    networks:
      - nexusdl-network

# ============================================================================
# VOLUMES NOMMÉS (Persistants)
# ============================================================================
volumes:
  nexusdl-data:
    driver: local
    name: nexusdl-data
  nexusdl-logs:
    driver: local
    name: nexusdl-logs
  nexusdl-cache:
    driver: local
    name: nexusdl-cache
  playwright-cache:
    driver: local
    name: playright-cache

# ============================================================================
# RÉSEAUX
# ============================================================================
networks:
  nexusdl-network:
    driver: bridge
    name: nexusdl-network
