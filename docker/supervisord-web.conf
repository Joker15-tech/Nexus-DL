; ============================================================================
; NEXUSDL WEB - Supervisor Configuration
; ============================================================================
; Ce fichier gère les 3 processus du conteneur Docker "nexusdl-web" :
;   1. FastAPI/Uvicorn (backend Python) - port interne 8001
;   2. Next.js (frontend standalone)    - port interne 3000
;   3. Nginx (reverse proxy)            - port exposé 80
;
; Ordre de démarrage :
;   FastAPI (priority 10) → Next.js (priority 20) → Nginx (priority 30)
;
; Ce fichier est copié dans le Dockerfile.web :
;   COPY docker/supervisord-web.conf /etc/supervisor/conf.d/supervisord.conf
; ============================================================================

; ============================================================================
; CONFIGURATION GLOBALE DE SUPERVISOR
; ============================================================================
[supervisord]
; Mode non-daemon : OBLIGATOIRE pour Docker
; Sinon le conteneur s'arrête immédiatement car le processus principal se termine
nodaemon=true

; Utilisateur (root pour avoir accès à tous les chemins)
user=root

; Fichiers de logs
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info

; PID file
pidfile=/var/run/supervisord.pid

; Répertoire des logs des processus enfants
childlogdir=/var/log/supervisor

; Encodage
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

; ============================================================================
; RPC INTERFACE (optionnel - pour supervisorctl)
; ============================================================================
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================================
; UNIX HTTP SERVER (pour supervisorctl)
; ============================================================================
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ============================================================================
; 1. FASTAPI - Backend Python (Uvicorn)
; ============================================================================
; Port interne : 8001 (non exposé, accessible uniquement via Nginx)
; ============================================================================
[program:fastapi]
command=/usr/local/bin/uvicorn nexusdl.interfaces.web.backend.main:app --host 127.0.0.1 --port 8001 --workers 1 --proxy-headers --forwarded-allow-ips '*'

; Répertoire de travail
directory=/app

; Variables d'environnement critiques
environment=
    PYTHONPATH="/app/src:/app",
    PYTHONUNBUFFERED="1",
    PYTHONDONTWRITEBYTECODE="1",
    NEXUSDL_ENV="production",
    PORT="8001",
    HOST="127.0.0.1",
    PLAYWRIGHT_BROWSERS_PATH="/root/.cache/ms-playwright"

; Démarrage automatique
autostart=true
autorestart=true

; Priorité : FastAPI démarre EN PREMIER (avant Nginx)
priority=10

; Temps d'attente pour considérer le processus comme démarré
; ⚠️ IMPORTANT : Playwright peut prendre du temps au premier démarrage
startsecs=15
startretries=5

; Temps accordé pour s'arrêter proprement (graceful shutdown)
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; Redirection des logs
stdout_logfile=/var/log/supervisor/fastapi-stdout.log
stderr_logfile=/var/log/supervisor/fastapi-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_capture_maxbytes=1MB
stderr_capture_maxbytes=1MB

; ============================================================================
; 2. NEXT.JS - Frontend Standalone
; ============================================================================
; Port interne : 3000 (non exposé, accessible uniquement via Nginx)
; ============================================================================
[program:nextjs]
command=/usr/local/bin/node server.js

; Répertoire de travail : le build standalone de Next.js
directory=/app/frontend/standalone

; Variables d'environnement Next.js
environment=
    NODE_ENV="production",
    PORT="3000",
    HOSTNAME="127.0.0.1",
    NEXT_TELEMETRY_DISABLED="1"

; Démarrage automatique
autostart=true
autorestart=true

; Priorité : Next.js démarre APRÈS FastAPI mais AVANT Nginx
priority=20

; Temps d'attente pour considérer le processus comme démarré
startsecs=10
startretries=5

; Temps accordé pour s'arrêter proprement
stopwaitsecs=20
stopasgroup=true
killasgroup=true

; Redirection des logs
stdout_logfile=/var/log/supervisor/nextjs-stdout.log
stderr_logfile=/var/log/supervisor/nextjs-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_capture_maxbytes=1MB
stderr_capture_maxbytes=1MB

; ============================================================================
; 3. NGINX - Reverse Proxy
; ============================================================================
; Port exposé : 80 (accessible depuis l'extérieur)
; ============================================================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"

; Démarrage automatique
autostart=true
autorestart=true

; Priorité : Nginx démarre EN DERNIER (après FastAPI et Next.js)
; Ainsi, quand Nginx démarre, les deux backends sont déjà prêts
priority=30

; Temps d'attente pour considérer le processus comme démarré
startsecs=5
startretries=3

; Temps accordé pour s'arrêter proprement
stopwaitsecs=10
stopasgroup=true
killasgroup=true

; Redirection des logs
stdout_logfile=/var/log/supervisor/nginx-stdout.log
stderr_logfile=/var/log/supervisor/nginx-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_capture_maxbytes=1MB
stderr_capture_maxbytes=1MB

; ============================================================================
; GROUPES (optionnel - pour gérer tous les processus ensemble)
; ============================================================================
[group:nexusdl]
programs=fastapi,nextjs,nginx

; ============================================================================
; FIN DU FICHIER
; ============================================================================
