# ============================================================================
#  NexusDL — Configuration Nginx (reverse proxy + TLS + WebSocket + static)
#  Monté dans le conteneur via docker-compose.yml
#  Utilisé comme /etc/nginx/nginx.conf
# ============================================================================

# --- Utilisateur et workers --------------------------------------------------
# Dans l'image officielle nginx, l'utilisateur est "nginx".
user  nginx;
# "auto" = nombre de cœurs CPU détectés. Adapter selon la charge.
worker_processes  auto;

# Fichier PID + limite de descripteurs
pid  /var/run/nginx.pid;
worker_rlimit_nofile  65535;

# --- Logs --------------------------------------------------------------------
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

# --- Événements --------------------------------------------------------------
events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

# ============================================================================
#  HTTP — Redirection vers HTTPS + challenge ACME
# ============================================================================
http {
    # --- Types MIME + defaults -----------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # --- Logs formatés --------------------------------------------------------
    # Format "combined" enrichi : upstream, temps de réponse, cache, request_id
    log_format main escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"request_id":"$request_id",'
            '"upstream_cache_status":"$upstream_cache_status"'
        '}';

    access_log  /var/log/nginx/access.log  main  buffer=32k  flush=5s;

    # --- Performance ----------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;             # Masque la version Nginx

    # --- Timeouts (adaptés au streaming de gros CBZ) --------------------------
    client_max_body_size        512m;    # Upload de fichiers (backup, restore)
    client_body_buffer_size     128k;
    client_body_timeout         60s;
    client_header_timeout       60s;
    send_timeout                300s;
    reset_timedout_connection   on;

    # --- Compression ----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.api+json
        image/svg+xml
        font/woff
        font/woff2;

    # Brotli — nécessite le module ngx_brotli (image nginx:alpine custom).
    # Décommenter si disponible dans l'image utilisée.
    # brotli              on;
    # brotli_comp_level   6;
    # brotli_types        text/plain text/css application/json application/javascript
    #                     application/xml image/svg+xml;

    # --- Rate limiting --------------------------------------------------------
    # Zones de limitation (définies au niveau http, appliquées au niveau location)
    # 10m ≈ 160 000 IP en mémoire.
    limit_req_zone  $binary_remote_addr  zone=api_general:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=api_auth:10m     rate=5r/m;
    limit_req_zone  $binary_remote_addr  zone=api_search:10m   rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=api_download:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # --- Cache proxy ----------------------------------------------------------
    proxy_cache_path  /var/cache/nginx/api
        levels=1:2
        keys_zone=api_cache:10m
        max_size=1g
        inactive=10m
        use_temp_path=off;

    # --- Map pour WebSocket upgrade -------------------------------------------
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # --- Map pour request_id --------------------------------------------------
    map $http_x_request_id $req_id {
        default  $http_x_request_id;
        ''       $request_id;
    }

    # --- Map pour HSTS selon le domaine (prod seulement) ----------------------
    map $host $hsts_header {
        default                                "";
        "~^nexusdl\.example\.com$"             "max-age=31536000; includeSubDomains; preload";
    }

    # --- Upstream FastAPI (backend) ------------------------------------------
    # Le nom "web-backend" est résolu par Docker DNS interne.
    upstream nexusdl_backend {
        server  web-backend:8000  max_fails=3  fail_timeout=10s;
        keepalive  32;
        keepalive_timeout  60s;
        keepalive_requests 1000;
    }

    # --- Upstream FlareSolverr (optionnel, pour /flaresolverr) ---------------
    upstream flaresolverr {
        server  flaresolverr:8191  max_fails=3  fail_timeout=10s;
        keepalive  8;
    }

    # ========================================================================
    #  SERVEUR HTTP — Redirection + ACME
    # ========================================================================
    server {
        listen       80  default_server;
        listen       [::]:80  default_server;
        server_name  _;

        # --- Challenge ACME (Let's Encrypt) ----------------------------------
        location /.well-known/acme-challenge/ {
            root  /var/www/acme;
            default_type "text/plain";
            try_files  $uri =404;
        }

        # --- Redirection HTTPS (301 = permanent, caché par les navigateurs) --
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================================
    #  SERVEUR HTTPS — Application principale
    # ========================================================================
    server {
        listen       443  ssl  http2;
        listen       [::]:443  ssl  http2;
        server_name  nexusdl.example.com  localhost;

        # --- Certificats TLS --------------------------------------------------
        # En prod : Let's Encrypt via certbot (chemins standard).
        # En dev : certificat auto-signé généré par docker/entrypoint.sh.
        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;
        ssl_trusted_certificate /etc/nginx/certs/chain.pem;

        # --- Protocoles et ciphers (modernes, compatibles navigateurs 2020+) --
        ssl_protocols              TLSv1.2  TLSv1.3;
        ssl_prefer_server_ciphers  off;      # Laisser le client choisir (TLS 1.3)
        ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # --- Session SSL (cache partagé entre workers) ------------------------
        ssl_session_cache    shared:SSL:50m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;            # Désactivé pour la forward secrecy

        # --- OCSP Stapling ----------------------------------------------------
        ssl_stapling         on;
        ssl_stapling_verify  on;
        resolver             1.1.1.1  8.8.8.8  valid=300s  ipv6=off;
        resolver_timeout     5s;

        # --- En-têtes de sécurité --------------------------------------------
        add_header  X-Frame-Options            "SAMEORIGIN"              always;
        add_header  X-Content-Type-Options     "nosniff"                 always;
        add_header  X-XSS-Protection           "1; mode=block"           always;
        add_header  Referrer-Policy            "strict-origin-when-cross-origin"  always;
        add_header  Permissions-Policy         "geolocation=(), microphone=(), camera=()"  always;
        add_header  Strict-Transport-Security  $hsts_header              always;

        # CSP : ajustée pour Next.js + WebSocket. À durcir selon les besoins.
        # 'unsafe-inline' requis par Next.js pour les scripts d'hydratation ;
        # à remplacer par des nonces si possible (Next.js 14 supporte).
        add_header  Content-Security-Policy
            "default-src 'self'; \
             script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
             style-src 'self' 'unsafe-inline'; \
             img-src 'self' data: blob: https:; \
             font-src 'self' data:; \
             connect-src 'self' ws: wss:; \
             frame-ancestors 'self'; \
             base-uri 'self'; \
             form-action 'self'"  always;

        # --- Request ID (traçabilité) ----------------------------------------
        add_header  X-Request-ID  $req_id  always;

        # ====================================================================
        #  ROUTES
        # ====================================================================

        # --- WebSocket temps réel (/ws/*) ------------------------------------
        # Doit être AVANT /api/ sinon le match générique l'attrape.
        location /ws/ {
            proxy_pass         http://nexusdl_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $req_id;

            # WebSocket : pas de buffering, timeouts longs
            proxy_buffering        off;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
            proxy_connect_timeout  10s;
        }

        # --- Endpoints d'auth (rate limit strict) ----------------------------
        location ~ ^/api/auth/(login|register|refresh|reset) {
            limit_req   zone=api_auth  burst=3  nodelay;
            limit_conn  conn_per_ip  10;

            proxy_pass         http://nexusdl_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $req_id;
            proxy_set_header   Connection        "";

            # Pas de cache sur les endpoints sensibles
            proxy_cache  off;
        }

        # --- Recherche multi-sites (rate limit modéré, cache court) ----------
        location ~ ^/api/search {
            limit_req   zone=api_search  burst=20  nodelay;
            limit_conn  conn_per_ip  50;

            proxy_pass         http://nexusdl_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $req_id;
            proxy_set_header   Connection        "";

            # Cache 60s : résultats de recherche peu volatils
            proxy_cache            api_cache;
            proxy_cache_methods    GET POST;
            proxy_cache_key        "$scheme$request_method$host$request_uri$request_body";
            proxy_cache_valid      200  60s;
            proxy_cache_valid      404  10s;
            proxy_cache_bypass     $http_authorization;  # Ne pas cacher les requêtes auth
            proxy_cache_use_stale  error timeout updating;
            proxy_cache_background_update on;
            proxy_cache_lock       on;
            add_header             X-Cache-Status $upstream_cache_status  always;
        }

        # --- Téléchargements (rate limit strict, pas de cache) ---------------
        location ~ ^/api/download {
            limit_req   zone=api_download  burst=10  nodelay;
            limit_conn  conn_per_ip  20;

            proxy_pass         http://nexusdl_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $req_id;
            proxy_set_header   Connection        "";

            # Streaming : pas de buffering complet en mémoire
            proxy_buffering        off;
            proxy_request_buffering off;
            proxy_read_timeout     600s;    # 10 min pour gros CBZ
            proxy_send_timeout     600s;
            proxy_cache            off;
        }

        # --- API générale ----------------------------------------------------
        location /api/ {
            limit_req   zone=api_general  burst=50  nodelay;
            limit_conn  conn_per_ip  100;

            proxy_pass         http://nexusdl_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $req_id;
            proxy_set_header   Connection        "";

            proxy_connect_timeout  10s;
            proxy_send_timeout     120s;
            proxy_read_timeout     120s;

            proxy_cache            api_cache;
            proxy_cache_key        "$scheme$request_method$host$request_uri";
            proxy_cache_valid      200  30s;
            proxy_cache_bypass     $http_authorization;
            proxy_cache_use_stale  error timeout updating;
            add_header             X-Cache-Status $upstream_cache_status  always;
        }

        # --- Docs FastAPI (à protéger en prod si docs_enabled: false) --------
        location ~ ^/(docs|redoc|openapi\.json) {
            # Décommenter pour restreindre aux IPs internes
            # allow  10.0.0.0/8;
            # allow  172.16.0.0/12;
            # allow  192.168.0.0/16;
            # deny   all;

            proxy_pass         http://nexusdl_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # --- Healthcheck interne (non exposé publiquement) -------------------
        location = /health {
            access_log  off;
            proxy_pass  http://nexusdl_backend/api/health;
            proxy_set_header Host $host;
        }

        location = /nginx-health {
            access_log  off;
            return  200  "ok\n";
            add_header  Content-Type  text/plain;
        }

        # --- FlareSolverr (optionnel — jamais exposé publiquement) -----------
        # Décommenter + sécuriser par IP si nécessaire.
        # location /flaresolverr/ {
        #     allow  10.0.0.0/8;
        #     allow  172.16.0.0/12;
        #     deny   all;
        #     rewrite  ^/flaresolverr/(.*)$  /$1  break;
        #     proxy_pass  http://flaresolverr;
        # }

        # --- Frontend statique (Next.js export) ------------------------------
        # Servi directement par Nginx — pas de hop vers FastAPI.
        root  /var/www/nexusdl;
        index  index.html;

        location / {
            try_files  $uri  $uri/  $uri.html  /index.html;

            # Cache des assets Next.js (hash dans le nom → immutable)
            location ~* ^/_next/static/ {
                expires  1y;
                add_header  Cache-Control  "public, max-age=31536000, immutable"  always;
                access_log  off;
                try_files  $uri =404;
            }

            # Fichiers statiques génériques
            location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
                expires  30d;
                add_header  Cache-Control  "public, max-age=2592000"  always;
                access_log  off;
                try_files  $uri =404;
            }

            # HTML : cache court (pour revalidation)
            location ~* \.html?$ {
                expires  5m;
                add_header  Cache-Control  "public, max-age=300, must-revalidate"  always;
            }
        }

        # --- Blocage des fichiers sensibles ----------------------------------
        location ~ /\.(?!well-known) {
            deny  all;
            access_log  off;
        }

        location ~* \.(env|yaml|yml|toml|lock|sql|db|bak|sqlite|log)$ {
            deny  all;
            access_log  off;
        }

        # --- Erreurs personnalisées -----------------------------------------
        error_page  404  /404.html;
        error_page  500  502  503  504  /50x.html;

        location = /404.html {
            internal;
            root  /var/www/nexusdl;
        }

        location = /50x.html {
            internal;
            root  /var/www/nexusdl;
        }
    }
}
