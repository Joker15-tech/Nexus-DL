# ============================================================================
# NEXUSDL - Configuration Nginx (Reverse Proxy)
# ============================================================================
# Architecture :
#   Client → Nginx (port 80) → FastAPI (port 8001) / Next.js (port 3000)
#
# Rôles :
#   - Reverse proxy pour FastAPI (API REST + WebSocket)
#   - Reverse proxy pour Next.js (frontend standalone)
#   - Compression gzip
#   - Headers de sécurité
#   - Cache des assets statiques
#   - Rate limiting basique
# ============================================================================

# Nombre de workers (auto = nombre de CPU)
worker_processes auto;

# Fichier PID
pid /var/run/nginx.pid;

# Limite de fichiers ouverts
events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ========================================================================
    # CONFIGURATION DE BASE
    # ========================================================================
    
    # Types MIME
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logs formatés
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Optimisations performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Cache la version de Nginx
    
    # Limite de taille des requêtes (uploads)
    client_max_body_size 50M;
    
    # ========================================================================
    # COMPRESSION GZIP
    # ========================================================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml
        font/opentype
        font/ttf
        font/woff
        font/woff2;
    
    # ========================================================================
    # RATE LIMITING (protection basique contre les abus)
    # ========================================================================
    
    # Zone de rate limiting : 10 requêtes par seconde par IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    
    # ========================================================================
    # UPSTREAMS (serveurs backend)
    # ========================================================================
    
    # FastAPI backend (API REST + WebSocket)
    upstream fastapi_backend {
        server 127.0.0.1:8001;
        keepalive 32;
    }
    
    # Next.js frontend (mode standalone)
    upstream nextjs_frontend {
        server 127.0.0.1:3000;
        keepalive 16;
    }
    
    # ========================================================================
    # MAP POUR WEBSOCKET
    # ========================================================================
    
    # Détecte si la requête est un WebSocket pour le header Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    # ========================================================================
    # SERVEUR PRINCIPAL
    # ========================================================================
    
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        
        server_name _;
        
        # ====================================================================
        # HEADERS DE SÉCURITÉ (appliqués à toutes les réponses)
        # ====================================================================
        
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # ====================================================================
        # HEALTHCHECK (pour Railway/Render/Docker)
        # ====================================================================
        
        location = /health {
            access_log off;
            proxy_pass http://fastapi_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ====================================================================
        # API REST (FastAPI) - /api/v1/*
        # ====================================================================
        
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            
            # Headers essentiels pour FastAPI
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Keepalive
            proxy_set_header Connection "";
        }
        
        # ====================================================================
        # WEBSOCKET - /ws/*
        # ====================================================================
        
        location /ws {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            
            # Headers WebSocket OBLIGATOIRES
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts longs pour les WebSockets
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }
        
        # ====================================================================
        # DOCUMENTATION API (Swagger/ReDoc/OpenAPI)
        # ====================================================================
        
        location = /docs {
            proxy_pass http://fastapi_backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /docs/ {
            proxy_pass http://fastapi_backend/docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location = /redoc {
            proxy_pass http://fastapi_backend/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location = /openapi.json {
            proxy_pass http://fastapi_backend/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ====================================================================
        # ASSETS STATIQUES NEXT.JS (cache long)
        # ====================================================================
        
        location /_next/static/ {
            proxy_pass http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Cache immutable (1 an) - les fichiers Next.js ont des hashes
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
        
        # ====================================================================
        # FICHIERS PUBLICS (cache moyen)
        # ====================================================================
        
        location /public/ {
            proxy_pass http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            add_header Cache-Control "public, max-age=86400";
        }
        
        # Images et fonts (cache long)
        location ~* \.(ico|gif|jpe?g|png|svg|webp|avif|woff2?|ttf|eot|otf)$ {
            proxy_pass http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }
        
        # ====================================================================
        # FRONTEND NEXT.JS (catch-all) - TOUT LE RESTE
        # ====================================================================
        
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            
            proxy_pass http://nextjs_frontend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # ====================================================================
        # ERREURS PERSONNALISÉES
        # ====================================================================
        
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
